version: "3.9"

services:
  # ─── Databases ─────────────────────────────────────────────────────────────

  main-database:
    image: postgres:16-alpine
    container_name: main-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./main-database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-appdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ─── Backend Services ───────────────────────────────────────────────────────

  whatsapp-gw:
    image: ghcr.io/${GITHUB_ORG:-your-org}/${WH_GW_IMAGE:-whatsapp-gw}:${WH_GW_TAG:-latest}
    volumes:
      - whatsapp-session:/app/.wwebjs_auth
    build:
      context: ./whatsapp-gw
      dockerfile: Dockerfile
    container_name: whatsapp-gw
    restart: unless-stopped
    environment:
      MAIN_SERVICE_URL: http://localhost:8000
      DB_HOST: main-database
      DB_PORT: 5432
      DB_NAME: appdb
      DB_USER: whatsapp_gw
      DB_PASSWORD: whatsapp_gw_secret
    ports:
      - "3000:3000"
      - "3001:3001"
    depends_on:
      main-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - backend

