version: "3.9"

services:
  # ─── Databases ─────────────────────────────────────────────────────────────

  main-database:
    image: postgres:16-alpine
    container_name: main-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_AGENT_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_AGENT_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./main-database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-appdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ─── Backend Services ───────────────────────────────────────────────────────

  whatsapp-gw:
    image: ghcr.io/${GITHUB_ORG:-your-org}/${WH_GW_IMAGE:-whatsapp-gw}:${WH_GW_TAG:-latest}
    volumes:
      - whatsapp-session:/app/.wwebjs_auth
    container_name: whatsapp-gw
    hostname: whatsapp-gw
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      MAIN_SERVICE_URL: http://social-media-agent:8000
      DB_HOST: main-database
      DB_PORT: 5432
      DB_NAME: appdb
      DB_USER: whatsapp_gw
      DB_PASSWORD: whatsapp_gw_secret
      DB_SSL: "false"
      PGSSLMODE: disable
    ports:
      - "3000:3000"
      - "3001:3001"
    depends_on:
      main-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - backend

  social-media-agent:
    image: ghcr.io/${GITHUB_ORG:-your-org}/${AGENT_IMAGE:-social-media-agent-main}:${AGENT_TAG:-latest}
    container_name: social-media-agent
    restart: unless-stopped
    env_file:
      - .env
      - .env.local
    environment:
      POSTGRES_URL: postgresql+asyncpg://${POSTGRES_AGENT_USER:-admin}:${POSTGRES_AGENT_PASSWORD:-secret}@main-database:5432/${POSTGRES_DB:-appdb}
      DYNAMODB_ARCHIVE_ENABLED: "false"
    ports:
      - "8000:8000"
    depends_on:
      main-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - backend

  # ─── Frontend ───────────────────────────────────────────────────────────────

  social-media-agent-web:
    image: ghcr.io/${GITHUB_ORG:-your-org}/${AGENT_WEB_IMAGE:-social-media-agent-web}:${AGENT_WEB_TAG:-latest}
    container_name: social-media-agent-web
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # Override .env.local server-side URLs for Docker networking
      WHATSAPP_GW_URL: ${WHATSAPP_GW_URL}
      MAIN_SERVICE_URL: ${MAIN_SERVICE_URL}
      NEXT_PUBLIC_WHATSAPP_GW_URL: ${NEXT_PUBLIC_WHATSAPP_GW_URL}
      NEXT_PUBLIC_MAIN_SERVICE: ${NEXT_PUBLIC_MAIN_SERVICE}
    ports:
      - "3005:3005"
    depends_on:
      - whatsapp-gw
      - social-media-agent
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3005/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - backend
      - frontend

# ─── Volumes & Networks ──────────────────────────────────────────────────────

volumes:
  postgres_data:
  whatsapp-session:

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
